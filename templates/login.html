<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>
        body {
            background-color: purple;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        a {
            color: yellow;
        }
    </style>

</head>
<body>

<h1>Login</h1>

<form method="POST">

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">
        Login
    </button>

</form>

<a href="/register">Register here</a>

</body>
</html>
