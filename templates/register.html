<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        body {
            background-color: purple;
            color: white;
            font-family: Arial;
            text-align: center;
            padding-top: 100px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }

        button {
            cursor: pointer;
        }

        a {
            color: yellow;
        }

    </style>

</head>
<body>

<h1>Register</h1>

<form method="POST">

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

<br>

<a href="/login">Login here</a>

</body>
</html>
